name: QA Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analisis estatico con Robocop (quality gate)
        run: robocop check

      - name: Ejecutar suite Robot Framework
        run: robot --outputdir TestResults tests/

      - name: Publicar reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: TestResults/
